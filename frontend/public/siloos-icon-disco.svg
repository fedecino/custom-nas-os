<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sfondo squircle coerente con il logo -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e33"/>
      <stop offset="100%" stop-color="#090e1a"/>
    </linearGradient>

    <!-- Bagliore radiale ciano dietro al disco -->
    <radialGradient id="platterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#iconBg)" stroke="#1e293b" stroke-width="6"/>

  <!-- Bagliore centrale -->
  <circle cx="256" cy="256" r="210" fill="url(#platterGlow)"/>

  <!-- Piatto Disco Ottico / HDD (derivato dalla 'O' del logo) -->
  <g fill="none" stroke-linecap="round">
    <!-- Anello esterno del disco -->
    <circle cx="256" cy="256" r="132" stroke="#38bdf8" stroke-width="38"/>

    <!-- Riflesso bianco ad arco in alto a destra -->
    <path d="M 256 124 A 132 132 0 0 1 388 256" stroke="#ffffff" stroke-width="14"/>

    <!-- Mozzo centrale verde LED -->
    <circle cx="256" cy="256" r="40" stroke="#00ff88" stroke-width="20"/>
  </g>
</svg>
