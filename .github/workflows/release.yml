name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Create Release & Build ISO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check if a new release is needed
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRY_OUT=$(npx --yes \
            -p semantic-release@24 \
            -p conventional-changelog-conventionalcommits@8 \
            -p @semantic-release/changelog@6 \
            -p @semantic-release/exec@7 \
            -p @semantic-release/git@10 \
            -p @semantic-release/github@11 \
            semantic-release --dry-run 2>&1 || true)
          echo "$DRY_OUT"
          if echo "$DRY_OUT" | grep -q "The next release version is"; then
            NEXT_VER=$(echo "$DRY_OUT" | grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "next_version=${NEXT_VER}" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build x86_64 Bootable ISO via Docker
        if: steps.check.outputs.should_release == 'true'
        env:
          SILOOS_VERSION: ${{ steps.check.outputs.next_version }}
        run: |
          chmod +x iso-builder/build-iso-docker.sh iso-builder/build-iso.sh
          ./iso-builder/build-iso-docker.sh
          ISO_FILE=$(ls -1 siloos-x86_64-*.iso | head -n1)
          sha256sum "$ISO_FILE" > "${ISO_FILE}.sha256"

      - name: Publish Release with ISO Asset
        if: steps.check.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release@24 \
            -p conventional-changelog-conventionalcommits@8 \
            -p @semantic-release/changelog@6 \
            -p @semantic-release/exec@7 \
            -p @semantic-release/git@10 \
            -p @semantic-release/github@11 \
            semantic-release
